name: Publish beta channel

# Publishes the opt-in beta APT repo under docs/beta/ from a build's debs.
#
# build.yml stays "build and verify only" — it must never push. This workflow
# owns the push, and only ever writes docs/beta/: the stable repo at docs/ and
# everyone who added the main URL are untouched, whatever happens here.
#
# It does not compile anything. The arm64e linker that build.yml needs a macOS
# runner for produced the debs already; publishing just repackages those exact
# bytes into an APT index, which is plain dpkg + git on Ubuntu. So this takes
# the debs from a completed build run rather than rebuilding them — same bytes
# the testers would sideload, now discoverable.
#
#   Actions -> Publish beta channel -> Run workflow
#     run_id: the green build.yml run whose debs to publish
#
# The debs carry their own version; repo-build-beta.sh refuses anything that is
# not a pre-release, so pointing this at a stable build fails instead of
# poisoning the beta channel with a release.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build.yml run id whose debs to publish (a green beta build)'
        required: true

# Only what the push needs. contents: write to commit docs/beta/ to master;
# actions: read to fetch the artifact from the other run.
permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download the beta debs
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the beta channel
        run: |
          if ! ls release/*.deb >/dev/null 2>&1; then
            echo "::error::run ${{ inputs.run_id }} produced no debs artifact"
            exit 1
          fi
          bash tools/repo-build-beta.sh

      - name: Commit docs/beta to master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/beta
          if git diff --cached --quiet; then
            echo "beta channel already up to date — nothing to publish"
            exit 0
          fi
          VER="$(dpkg-deb -f "$(ls release/*.deb | head -1)" Version)"
          git commit -m "Publish beta channel $VER" \
                     -m "Generated by publish-beta.yml from build run ${{ inputs.run_id }}. Stable docs/ untouched."
          git push origin HEAD:master
          echo "published beta $VER to docs/beta/"
